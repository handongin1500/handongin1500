<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-label="Han Dongin · Frontend Developer">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#0D1117"/><line x1="0" y1="0" x2="0" y2="6" stroke="#6E7681" stroke-width="2"/></pattern>
    <style>
      .role{font:700 20px 'Segoe UI','Pretendard',-apple-system,'Helvetica Neue',Arial,sans-serif;letter-spacing:3px;fill:#58A6FF}
      .name{font:700 64px 'Segoe UI','Pretendard',-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#E6EDF3}
      .tag{font:600 26px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#E6EDF3;opacity:0}
      .t1{opacity:1}
      .proj{font:600 24px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#9198A1}
      .title{font:700 24px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#E6EDF3}
      .legend{font:500 22px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#9198A1}
      .bad{font:700 24px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#FF7B72}
      .ctx{font:600 21px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#9198A1}
      @keyframes cycle{0%{opacity:0;transform:translateY(6px)}5%,28%{opacity:1;transform:translateY(0)}33%,100%{opacity:0}}
      @media (prefers-reduced-motion: no-preference){
        .tag{animation:cycle 9s infinite both}
        .t1{animation-delay:-.45s}.t2{animation-delay:2.55s}.t3{animation-delay:5.55s}
      }
    </style>
  </defs>
  <rect x="1" y="1" width="598" height="438" rx="20" fill="#161B22" stroke="#30363D"/>
  <rect x="36" y="32" width="330" height="44" rx="22.0" fill="#132339"/>
