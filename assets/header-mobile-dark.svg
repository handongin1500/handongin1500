<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 284" width="600" height="284" role="img" aria-label="Han Dongin · Frontend Developer">
  <defs>
    <style>
      .role{font:700 20px 'Segoe UI','Pretendard',-apple-system,'Helvetica Neue',Arial,sans-serif;letter-spacing:3px;fill:#58A6FF}
      .name{font:700 64px 'Segoe UI','Pretendard',-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#E6EDF3}
      .tag{font:600 26px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#E6EDF3;opacity:0}
      .t1{opacity:1}
      .proj{font:600 24px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#9198A1}
      @keyframes cycle{0%{opacity:0;transform:translateY(6px)}5%,28%{opacity:1;transform:translateY(0)}33%,100%{opacity:0}}
      @media (prefers-reduced-motion: no-preference){
        .tag{animation:cycle 9s infinite both}
        .t1{animation-delay:-.45s}.t2{animation-delay:2.55s}.t3{animation-delay:5.55s}
      }
    </style>
  </defs>
  <rect x="1" y="1" width="598" height="282" rx="20" fill="#161B22" stroke="#30363D"/>
  <rect x="36" y="32" width="330" height="44" rx="22.0" fill="#132339"/>
  <text x="201.0" y="61.0" text-anchor="middle" class="role">FRONTEND DEVELOPER</text>
  <text x="32" y="148" class="name">Han Dongin</text>
  <text x="36" y="196" class="tag t1">화면이 사실만 말하게 만드는 개발자</text>
  <text x="36" y="196" class="tag t2">실패는 실패라고, 모르는 숫자는 모른다고</text>
  <text x="36" y="196" class="tag t3">규칙을 도구가 지키게 만드는 개발자</text>
  <circle cx="43.5" cy="238.1" r="7.5" fill="#3FB950"/>
  <text x="58.0" y="246" class="proj">쮸토피아</text>
  <circle cx="197.5" cy="238.1" r="7.5" fill="#58A6FF"/>
  <text x="212.0" y="246" class="proj">SSACURITY</text>
  <circle cx="393.7" cy="238.1" r="7.5" fill="#F0883E"/>
  <text x="408.2" y="246" class="proj">잡싸피</text>
</svg>
