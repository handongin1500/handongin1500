<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Han Dongin · Frontend Developer">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#0D1117"/><line x1="0" y1="0" x2="0" y2="6" stroke="#6E7681" stroke-width="2"/></pattern>
    <style>
      .role{font:700 14px 'Segoe UI','Pretendard',-apple-system,'Helvetica Neue',Arial,sans-serif;letter-spacing:3px;fill:#58A6FF}
      .name{font:700 68px 'Segoe UI','Pretendard',-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#E6EDF3}
      .tag{font:600 24px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#E6EDF3;opacity:0;animation:cycle 9s infinite}
      .t2{animation-delay:3s}.t3{animation-delay:6s}
      .proj{font:600 16px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#9198A1}
      .title{font:700 15px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#E6EDF3}
      .legend{font:500 13px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#9198A1}
      .bad{font:700 15px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#FF7B72}
      .bad2{font:500 13px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#9198A1}
      @keyframes cycle{0%{opacity:0;transform:translateY(6px)}5%,28%{opacity:1;transform:translateY(0)}33%,100%{opacity:0}}
      @media (prefers-reduced-motion: reduce){.tag{animation:none}.tag:not(.t2):not(.t3){opacity:1}}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="338" rx="20" fill="#161B22" stroke="#30363D"/>
  <rect x="64" y="62" width="254" height="32" rx="16" fill="#132339"/>
