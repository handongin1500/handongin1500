<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="580" height="300" role="img" aria-label="Han Dongin · Frontend Developer">
  <defs>
    <style>
      .role{font:700 17px 'Segoe UI','Pretendard',-apple-system,'Helvetica Neue',Arial,sans-serif;letter-spacing:2px;fill:#58A6FF}
      .name{font:700 60px 'Segoe UI','Pretendard',-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#E6EDF3}
      .tag{font:600 25px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#E6EDF3;opacity:0}
      .t1{opacity:1}
      .proj{font:600 18px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#9198A1}
      @keyframes cycle{0%{opacity:0;transform:translateY(6px)}5%,28%{opacity:1;transform:translateY(0)}33%,100%{opacity:0}}
      @media (prefers-reduced-motion: no-preference){
        .tag{animation:cycle 9s infinite both}
        .t1{animation-delay:-.45s}.t2{animation-delay:2.55s}.t3{animation-delay:5.55s}
      }
    </style>
  </defs>
  <rect x="1" y="1" width="578" height="298" rx="18" fill="#161B22" stroke="#30363D"/>
  <rect x="48" y="46" width="280" height="34" rx="17.0" fill="#132339"/>
  <text x="188.0" y="68.4" text-anchor="middle" class="role">FRONTEND DEVELOPER</text>
  <text x="44" y="150" class="name">Han Dongin</text>
  <text x="48" y="198" class="tag t1">화면이 사실만 말하게 만드는 개발자</text>
  <text x="48" y="198" class="tag t2">실패는 실패라고, 모르는 숫자는 모른다고</text>
  <text x="48" y="198" class="tag t3">규칙을 도구가 지키게 만드는 개발자</text>
  <circle cx="53.6" cy="244.1" r="5.6" fill="#3FB950"/>
  <text x="66.2" y="250" class="proj">쮸토피아</text>
  <circle cx="170.9" cy="244.1" r="5.6" fill="#58A6FF"/>
  <text x="183.5" y="250" class="proj">SSACURITY</text>
  <circle cx="319.8" cy="244.1" r="5.6" fill="#F0883E"/>
  <text x="332.4" y="250" class="proj">잡싸피</text>
</svg>
