  <text x="60" y="170" class="name">Han Dongin</text>
  <text x="64" y="222" text-anchor="start" class="tag">화면이 사실만 말하게 만드는 개발자</text>
  <text x="64" y="222" text-anchor="start" class="tag t2">실패는 실패라고, 모르는 숫자는 모른다고</text>
  <text x="64" y="222" text-anchor="start" class="tag t3">규칙을 도구가 지키게 만드는 개발자</text>
