<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3178C6"/>
      <stop offset="1" stop-color="#61DAFB"/>
    </linearGradient>
    <style>
      .name{font:700 56px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#fff}
      .role{font:500 22px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#fff;opacity:.9;letter-spacing:4px}
      .tag{font:600 20px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;fill:#0B3D91;opacity:0;animation:cycle 9s infinite}
      .t2{animation-delay:3s}.t3{animation-delay:6s}
      @keyframes cycle{0%{opacity:0;transform:translateY(8px)}5%,28%{opacity:1;transform:translateY(0)}33%,100%{opacity:0}}
    </style>
  </defs>
  <path d="M0 0H1200V190C1000 240 800 150 600 190C400 230 200 150 0 200Z" fill="url(#g)"/>
  <text x="600" y="100" text-anchor="middle" class="name">Han Dongin</text>
  <text x="600" y="140" text-anchor="middle" class="role">FRONTEND DEVELOPER</text>
  <text x="600" y="265" text-anchor="middle" class="tag">규칙을 도구가 지키게 만드는 개발자</text>
  <text x="600" y="265" text-anchor="middle" class="tag t2">숫자 하나 틀리지 않는 화면</text>
  <text x="600" y="265" text-anchor="middle" class="tag t3">거짓 경보 없는 실시간 관제</text>
</svg>
