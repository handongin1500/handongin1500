<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Han Dongin · Frontend Developer">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8C959F" stroke-width="2"/></pattern><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1F2328" flood-opacity="0.08"/></filter>
    <style>
      .role{font:700 17px 'Segoe UI','Pretendard',-apple-system,'Helvetica Neue',Arial,sans-serif;letter-spacing:2px;fill:#0969DA}
      .name{font:700 60px 'Segoe UI','Pretendard',-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#1F2328}
      .tag{font:600 25px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#1F2328;opacity:0}
      .t1{opacity:1}
      .proj{font:600 18px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#59636E}
      .title{font:700 18px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#1F2328}
      .legend{font:500 17px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#59636E}
      .bad{font:700 18px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#CF222E}
      .ctx{font:600 16px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif;fill:#59636E}
      @keyframes cycle{0%{opacity:0;transform:translateY(6px)}5%,28%{opacity:1;transform:translateY(0)}33%,100%{opacity:0}}
      @media (prefers-reduced-motion: no-preference){
        .tag{animation:cycle 9s infinite both}
        .t1{animation-delay:-.45s}.t2{animation-delay:2.55s}.t3{animation-delay:5.55s}
      }
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="298" rx="18" fill="#F6F8FA" stroke="#D0D7DE"/>
  <rect x="48" y="46" width="280" height="34" rx="17.0" fill="#DDF4FF"/>
  <text x="188.0" y="68.4" text-anchor="middle" class="role">FRONTEND DEVELOPER</text>
  <text x="44" y="150" class="name">Han Dongin</text>
  <text x="48" y="198" class="tag t1">화면이 사실만 말하게 만드는 개발자</text>
  <text x="48" y="198" class="tag t2">실패는 실패라고, 모르는 숫자는 모른다고</text>
  <text x="48" y="198" class="tag t3">규칙을 도구가 지키게 만드는 개발자</text>
